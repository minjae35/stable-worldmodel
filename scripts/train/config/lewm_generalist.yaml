defaults:
  - _self_
  - launcher: local

output_model_name: lewm_generalist
subdir: ${hydra:job.id}
# Full optimizer/scheduler resume is results/stage2a/<name>/checkpoints/resume.ckpt.
# Eval weights stay under ~/.stable_worldmodel/checkpoints/<name>/.
checkpoint_every_n_steps: 500
log_every_n_steps: 50

num_workers: 6
train_split: 0.9
seed: 3072
img_size: 224
patch_size: 14
encoder_scale: tiny
embed_dim: 192
# Clips of each environment on ONE GPU. Effective clips per environment
# are this value times the GPU count. The learning rate is not scaled.
per_env_batch_size: 32

trainer:
  max_epochs: 100
  max_steps: -1
  # 1 keeps the single-GPU recipe. Pass trainer.devices=2 or 4 for DDP.
  devices: 1
  accelerator: gpu
  precision: bf16
  gradient_clip_val: 1.0
  log_every_n_steps: 1
  num_sanity_val_steps: 1
  limit_val_batches: 1.0

# 0 skips the per-epoch weights_epoch_*.pt snapshot.
weights_every_n_epochs: 1

# null runs all max_epochs. A positive integer stops after that many
# epochs, including validation, without shortening the cosine horizon.
stop_after_epoch: null

# Stop once global_step reaches this value. Unlike trainer.max_steps,
# this does not shorten the cosine horizon. null disables it.
stop_at_global_step: null

# Save model weights at these global steps. null saves none.
snapshot_at_global_steps: null

loader:
  num_workers: ${num_workers}
  persistent_workers: True
  prefetch_factor: 3
  pin_memory: True

optimizer:
  type: AdamW
  lr: 5e-5
  weight_decay: 1e-3

wm:
  history_size: 3
  num_preds: 1

# Official LeWM tables. Each publishes only train.lance.
# Action blocks match the released specialist checkpoints:
#   pusht/tworoom raw 2 * frameskip 5 = 10
#   cube raw 5 * frameskip 5 = 25
data:
  # lance uses the tables below. synthetic is a cached random clip
  # bench and does not fit an action normalizer.
  source: lance
  synthetic_clips: 2560
  synthetic_pool: 8
  env_order:
    - pusht
    - tworoom
    - cube
  envs:
    pusht:
      num_steps: ${eval:'${wm.num_preds} + ${wm.history_size}'}
      frameskip: 5
      name: hf://datasets/fracapuano/lewm-pusht/train.lance
      keys_to_load:
        - pixels
        - action
      keys_to_cache:
        - action
    tworoom:
      num_steps: ${eval:'${wm.num_preds} + ${wm.history_size}'}
      frameskip: 5
      name: hf://datasets/fracapuano/lewm-tworooms/train.lance
      keys_to_load:
        - pixels
        - action
      keys_to_cache:
        - action
    cube:
      num_steps: ${eval:'${wm.num_preds} + ${wm.history_size}'}
      frameskip: 5
      name: hf://datasets/fracapuano/lewm-cube/train.lance
      keys_to_load:
        - pixels
        - action
      keys_to_cache:
        - action

model:
  _target_: stable_worldmodel.wm.lewm.generalist.GeneralistLeWM
  env_names: ${data.env_order}
  active_env: pusht
  encoder:
    _target_: stable_pretraining.backbone.utils.vit_hf
    size: ${encoder_scale}
    patch_size: ${patch_size}
    image_size: ${img_size}
    pretrained: false
    use_mask_token: false
  predictor:
    _target_: stable_worldmodel.wm.lewm.module.Predictor
    num_frames: ${wm.history_size}
    input_dim: ${embed_dim}
    hidden_dim: ${embed_dim}
    output_dim: ${embed_dim}
    depth: 6
    heads: 16
    mlp_dim: 2048
    dim_head: 64
    dropout: 0.1
    emb_dropout: 0.0
  action_adapters:
    pusht:
      _target_: stable_worldmodel.wm.lewm.module.Embedder
      input_dim: 10
      emb_dim: ${embed_dim}
    tworoom:
      _target_: stable_worldmodel.wm.lewm.module.Embedder
      input_dim: 10
      emb_dim: ${embed_dim}
    cube:
      _target_: stable_worldmodel.wm.lewm.module.Embedder
      input_dim: 25
      emb_dim: ${embed_dim}
  projector:
    _target_: stable_worldmodel.wm.lewm.module.MLP
    input_dim: ${embed_dim}
    output_dim: ${embed_dim}
    hidden_dim: 2048
    norm_fn:
      _target_: torch.nn.BatchNorm1d
      _partial_: true
  pred_proj:
    _target_: stable_worldmodel.wm.lewm.module.MLP
    input_dim: ${embed_dim}
    output_dim: ${embed_dim}
    hidden_dim: 2048
    norm_fn:
      _target_: torch.nn.BatchNorm1d
      _partial_: true

loss:
  # Stop-gradient on the prediction target. False keeps the original
  # next-latent MSE. True is the collapse-prevention comparison.
  detach_pred_target: false
  sigreg:
    weight: 0.09
    kwargs:
      knots: 17
      num_proj: 1024
  # Per-environment VICReg-style hinge on projector sample std.
  # weight 0 leaves the original objective unchanged.
  variance:
    weight: 0.0
    gamma: 1.0
    eps: 1.0e-6

wandb:
  enabled: false
  config:
    entity: stable-wm
    project: stable-wm
    name: ${output_model_name}
    id: ${subdir}
    resume: allow
    log_model: false
